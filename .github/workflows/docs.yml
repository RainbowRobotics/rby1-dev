# Builds the web manual (VitePress site in manual/, API pages generated from rby1-sdk)
# on every push and pull request.
# Publishing to the live site (branch new-gh-pages) runs only when started by hand
# (Actions > Docs > Run workflow, on branch dev, with "publish" checked).
name: Docs

on:
  push:
    branches-ignore: [new-gh-pages, gh-pages]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build to the live site (new-gh-pages)"
        type: boolean
        default: false

permissions:
  contents: read

# A new push cancels an older build of the same branch, but never a manual (publishing) run.
concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      sdk_version: ${{ steps.version.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # full history: per-page "Last updated" dates

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install documentation dependencies
        run: |
          uv sync
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: SDK version of the pinned submodule
        id: version
        run: echo "sdk_version=$(git -C external/rby1-sdk describe --tags --exact-match)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manual/package-lock.json

      - name: Build the site (API reference + VitePress)
        run: make -C doc html SDK_TAG=${{ steps.version.outputs.sdk_version }} PYTHON=python

      - name: Check links and anchors inside the site
        run: python manual/scripts/check_links.py manual/.vitepress/dist /rby1-dev/

      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: manual/.vitepress/dist
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: doc/scripts

      - uses: actions/checkout@v4
        with:
          ref: new-gh-pages
          path: site

      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: build

      - name: Place the build at the site root
        run: |
          python3 src/doc/scripts/publish_site.py --build build --site site \
            --version "${{ needs.build.outputs.sdk_version }}"

      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: publish ${{ needs.build.outputs.sdk_version }} from ${GITHUB_SHA::7}" || exit 0
          git push origin HEAD:new-gh-pages
