[project]
name = "rby1-dev"
version = "0.1.0"
description = "RB-Y1 web manual: Python tools that generate the API reference pages"
readme = "README.md"
requires-python = ">=3.10"
# The site itself is built with VitePress (manual/package.json). Python is used to export the
# Python/C++ API reference from the SDK as Markdown (doc/source/conf.py).
dependencies = [
    "breathe>=4.36.0",
    "pip>=25.2",
    "sphinx<=8.3.0",
    "sphinx-markdown-builder>=0.6.11",
]
